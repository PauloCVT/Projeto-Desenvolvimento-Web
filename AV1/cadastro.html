<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro | Astra</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="astra.css"></head>
<body class="account-page"><main class="account-shell"><a class="brand" href="index.html"><img src="logo.svg" alt="Nexa TI"><span>NEXA <b>TI</b></span></a><section class="form-panel wide"><p class="eyebrow">Primeiro passo</p><h1>Cadastro de clientes</h1><form id="register-form" novalidate><div class="form-two"><label for="register-email">E-mail / login <input id="register-email" type="email" placeholder="voce@empresa.com"></label><label for="register-name">Nome completo <input id="register-name" type="text" placeholder="Nome Sobrenome"></label></div><div class="form-two"><label for="register-password">Senha <input id="register-password" type="password"></label><label for="register-confirm">Confirme a senha <input id="register-confirm" type="password"></label></div><div class="instructions compact">Senha: mínimo de 6 caracteres, com número, letra maiúscula e um destes símbolos: <b>@ # $ % & * ! ? / \ | - _ + . =</b>. Não permitidos: <b>¨ { } [ ] ´ ` ~ ^ : ; &lt; &gt; , “ ‘</b>.</div><div class="form-two"><label for="register-cpf">CPF <input id="register-cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></label><label for="register-birth">Data de nascimento <input id="register-birth" type="date"></label></div><div class="form-two"><label for="register-phone">Celular / WhatsApp <input id="register-phone" type="tel" placeholder="(11) 99999-9999"></label><label for="register-education">Escolaridade <select id="register-education"><option>1º grau incompleto</option><option>1º grau completo</option><option selected>2º grau completo</option><option>Nível superior</option><option>Pós-graduado</option></select></label></div><fieldset><legend>Estado civil</legend><label class="radio"><input type="radio" name="marital" value="Solteiro(a)" checked> Solteiro(a)</label><label class="radio"><input type="radio" name="marital" value="Casado(a)"> Casado(a)</label><label class="radio"><input type="radio" name="marital" value="Divorciado(a)"> Divorciado(a)</label><label class="radio"><input type="radio" name="marital" value="Viúvo(a)"> Viúvo(a)</label></fieldset><p id="form-message" class="form-message" role="alert"></p><div class="form-actions"><button class="button" type="submit">Incluir</button><button class="button button-ghost" id="clear-register" type="button">Limpar</button><button class="button button-quiet" id="back-register" type="button">Voltar</button></div></form></section></main><script src="script.js"></script></body></html>
