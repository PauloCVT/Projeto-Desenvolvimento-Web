<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Troca de senha | Astra</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="astra.css"></head>
<body class="account-page"><main class="account-shell"><a class="brand" href="index.html"><img src="logo.svg" alt="Nexa TI"><span>NEXA <b>TI</b></span></a><section class="form-panel wide"><p class="eyebrow">Segurança da conta</p><h1>Troca de senha de clientes</h1><form id="password-form" novalidate><label for="password-email">Login / e-mail <input id="password-email" type="email" placeholder="voce@empresa.com"></label><div class="form-two"><label for="new-password">Nova senha <input id="new-password" type="password"></label><label for="confirm-password">Confirme a senha <input id="confirm-password" type="password"></label></div><div class="instructions"><strong>Regra da senha</strong><br>Use pelo menos 6 caracteres, incluindo um número, uma letra maiúscula e um caractere permitido: <b>@ # $ % & * ! ? / \ | - _ + . =</b><br>Não use: <b>¨ { } [ ] ´ ` ~ ^ : ; &lt; &gt; , “ ‘</b></div><p id="form-message" class="form-message" role="alert"></p><div class="form-actions"><button class="button" type="submit">Trocar senha</button><button class="button button-ghost" id="clear-password" type="button">Limpar</button></div></form><a class="back-link" href="login.html">← Voltar para o login</a></section></main><script src="script.js"></script></body></html>
